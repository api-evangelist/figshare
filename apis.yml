aid: figshare
name: Figshare
description: >-
  Figshare is a research data repository platform that enables researchers, institutions, and
  organizations to upload, manage, and publicly share scientific outputs including datasets,
  figures, media, papers, posters, and software. The platform provides persistent DOI assignment
  for all published research outputs, enabling proper citation and long-term discoverability.
  Figshare's REST API v2 allows programmatic access to articles, collections, projects, file
  uploads, statistics, and administrative functions. The platform is built on AWS infrastructure
  and supports both individual researchers with a free 20GB tier and institutional deployments
  with custom storage configurations up to multiple terabytes.
