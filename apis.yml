    name: Figshare API
    description: >-
      The Figshare REST API v2 provides full programmatic access to the platform, including
      public and private article management, file uploads (standard and S3-based), collections,
      projects, authors, licenses, funding, statistics, search, OAI-PMH harvesting, and
      institutional administration endpoints. Authentication is via OAuth 2.0 or personal tokens.
